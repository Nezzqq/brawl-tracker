<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brawl Tracker</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0d13;color:#f4f5fa;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}
main{max-width:900px;margin:auto;padding:22px 16px 50px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}
.logo{font-size:21px;font-weight:900;letter-spacing:-1px}
.logo span{color:#a78bfa}
.tagline{font-size:11px;color:#777d8e}
.panel{background:#151923;border:1px solid #252b3a;border-radius:17px;padding:17px;margin-bottom:14px}
h2{font-size:16px;margin:0 0 14px}
.search{display:flex;gap:8px}
input,button,select{font:inherit;border-radius:11px;border:1px solid #303747;background:#0d111a;color:white;padding:13px}
input{min-width:0;flex:1}
button{background:#7955e8;border:0;font-weight:700;cursor:pointer}
button:disabled{opacity:.5}
.muted{color:#858b9b;font-size:12px}
.error{color:#ff7777;font-size:13px;margin-top:12px}
.hero{display:flex;justify-content:space-between;align-items:center;gap:12px}
.player{font-size:19px;font-weight:800}
.trophies{font-size:36px;font-weight:900;letter-spacing:-1px;margin-top:5px}
.rank{background:#28213e;color:#c6b2ff;padding:9px 12px;border-radius:12px;font-size:13px;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.stat{background:#10141e;border-radius:12px;padding:12px}
.stat b{display:block;font-size:20px;margin-bottom:5px}
.stat span{font-size:11px;color:#858b9b}
.progress{height:8px;background:#292e3b;border-radius:20px;overflow:hidden;margin-top:10px}
.progress div{height:100%;background:#9b7bff}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
select{flex:1;min-width:130px;padding:10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.brawler{background:#10141e;border:1px solid #252b3a;border-radius:13px;padding:12px}
.brawler-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.brawler-name{font-weight:800;font-size:13px}
.power{font-size:11px;color:#c6b2ff;background:#29213e;padding:5px 8px;border-radius:8px}
.brawler-info{font-size:11px;color:#9298a8;margin-top:9px;display:flex;justify-content:space-between}
.loading{padding:25px;text-align:center;color:#9298a8}
@media(max-width:520px){
 .stats{grid-template-columns:repeat(2,1fr)}
 .grid{grid-template-columns:1fr}
 .trophies{font-size:31px}
}
</style>
</head>
<body>
<main>
<header>
 <div class="logo">BRAWL <span>TRACKER</span></div>
 <div class="tagline">PLAYER ANALYTICS</div>
</header>

<section class="panel">
 <h2>Поиск игрока</h2>
 <div class="search">
  <input id="tag" value="#8080QRRVQ" placeholder="Тег игрока">
  <button id="load">Найти</button>
 </div>
 <div id="message" class="muted" style="margin-top:10px">Загружаем профиль...</div>
</section>

<div id="content" hidden>
<section class="panel">
 <div class="hero">
  <div>
   <div class="player" id="name">Игрок</div>
   <div class="muted" id="playerTag"></div>
   <div class="trophies" id="trophies">0</div>
   <div class="muted">Текущие трофеи</div>
  </div>
  <div class="rank" id="rank">Ранг</div>
 </div>
 <div style="margin-top:22px">
  <div class="hero">
   <span class="muted">Цель: 150 000 трофеев</span>
   <b id="goalText">0%</b>
  </div>
  <div class="progress"><div id="goalBar"></div></div>
 </div>
</section>

<section class="panel">
 <h2>Статистика аккаунта</h2>
 <div class="stats">
  <div class="stat"><b id="three">0</b><span>Победы 3 на 3</span></div>
  <div class="stat"><b id="solo">0</b><span>Победы соло</span></div>
  <div class="stat"><b id="duo">0</b><span>Победы дуо</span></div>
  <div class="stat"><b id="prestige">0</b><span>Престиж</span></div>
 </div>
</section>

<section class="panel">
 <div class="hero" style="margin-bottom:14px">
  <h2 style="margin:0">Бойцы</h2>
  <b id="brawlerCount"></b>
 </div>
 <div class="toolbar">
  <select id="filter">
   <option value="all">Все бойцы</option>
   <option value="weak">Сила ниже 9</option>
   <option value="max">Сила 11</option>
  </select>
  <select id="sort">
   <option value="trophies">По трофеям</option>
   <option value="power">По силе</option>
   <option value="name">По имени</option>
  </select>
 </div>
 <div class="grid" id="brawlers"></div>
</section>
</div>
</main>

<script>
const $ = id => document.getElementById(id);
let player = null;

function number(n){
 return (n || 0).toLocaleString("ru-RU");
}

function render(){
 if(!player) return;

 $("name").textContent = player.name || "Игрок";
 $("playerTag").textContent = player.tag || "";
 $("trophies").textContent = number(player.trophies);
 $("rank").textContent = player.rankedRankName || "Без ранга";

 $("three").textContent = number(player["3vs3Victories"]);
 $("solo").textContent = number(player.soloVictories);
 $("duo").textContent = number(player.duoVictories);
 $("prestige").textContent = number(player.totalPrestigeLevel);

 const percent = Math.min(100, player.trophies / 150000 * 100);
 $("goalText").textContent = percent.toFixed(1) + "%";
 $("goalBar").style.width = percent + "%";

 const all = player.brawlers || [];
 const filter = $("filter").value;
 const sort = $("sort").value;

 let list = [...all];

 if(filter === "weak") list = list.filter(b => b.power < 9);
 if(filter === "max") list = list.filter(b => b.power === 11);

 if(sort === "trophies") list.sort((a,b) => b.trophies-a.trophies);
 if(sort === "power") list.sort((a,b) => b.power-a.power);
 if(sort === "name") list.sort((a,b) => a.name.localeCompare(b.name));

 $("brawlerCount").textContent = list.length + " / " + all.length;

 $("brawlers").innerHTML = list.map(b => `
  <div class="brawler">
   <div class="brawler-top">
    <span class="brawler-name">${escapeHTML(b.name)}</span>
    <span class="power">СИЛА ${b.power}</span>
   </div>
   <div class="brawler-info">
    <span>🏆 ${number(b.trophies)} трофеев</span>
    <span>Ранг ${b.rank}</span>
   </div>
  </div>
 `).join("");
}

function escapeHTML(value){
 return String(value ?? "").replace(/[&<>"']/g, c => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

async function loadPlayer(){
 const tag = $("tag").value.trim();
 if(!tag) return;

 $("load").disabled = true;
 $("message").textContent = "Загружаем данные игрока...";
 $("content").hidden = true;

 try{
  const response = await fetch(
   "/.netlify/functions/player?tag=" + encodeURIComponent(tag)
  );

  const data = await response.json();

  if(!response.ok) throw new Error(data.error || "Ошибка API");
  if(!data.brawlers) throw new Error("Профиль не содержит данных бойцов");

  player = data;
  render();
  $("content").hidden = false;
  $("message").textContent = "Профиль успешно загружен";
 }catch(error){
  $("message").innerHTML = "";
  const el = document.createElement("div");
  el.className = "error";
  el.textContent = error.message;
  $("message").appendChild(el);
 }finally{
  $("load").disabled = false;
 }
}

$("load").addEventListener("click", loadPlayer);
$("tag").addEventListener("keydown", e => {
 if(e.key === "Enter") loadPlayer();
});
$("filter").addEventListener("change", render);
$("sort").addEventListener("change", render);

loadPlayer();
</script>
</body>
</html>
